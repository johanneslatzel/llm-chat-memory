site_name: LLM Chat Memory
site_url: https://johanneslatzel.github.io/llm-chat-memory/
repo_url: https://github.com/johanneslatzel/llm-chat-memory
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
nav:
  - Overview: index.md
  - Quick Start: quickstart.md
  - How It Works: architecture.md
  - Hooks: hooks.md
  - Environment Variables: env.md
  - Tool Reference:
      - Overview: tools/index.md
      - add_memory: tools/add-memory.md
      - update_memory: tools/update-memory.md
      - delete_memory: tools/delete-memory.md
      - get_memory: tools/get-memory.md
      - recall_memories: tools/recall-memories.md
      - link_memories: tools/link-memories.md
      - unlink_memories: tools/unlink-memories.md
  - API Reference: api-reference.md
plugins:
  - search
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
