<svg role="img" aria-labelledby="llm-chat-memory-architecture-title" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1121" height="721" viewBox="-0.5 -0.5 1121 721">
  <title id="llm-chat-memory-architecture-title">llm-chat-memory architecture</title>
  <desc>MemoryService owns MemoryPool, LinkPool, SelectionStrategy, TextEmbeddingProvider and SemanticLinker. ChatService connects through MemoryHook for passive recall and MemoryToolPackage for CRUD, recall and link tools. MemoryPool persists to ObjectStore and memories/*.json; LinkPool feeds links and PageRank scores into MemoryPool; SelectionStrategy uses ScoreComposer.</desc><g><g></g><g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="0" y="0" width="1120" height="720" fill="#ffffff" stroke="none" pointer-events="all"></rect></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="430" y="20" width="220" height="50" rx="7.5" ry="7.5" fill="#f5f5f5" stroke="#666666" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" direction="" text-anchor="middle" font-size="13px"><rect fill="none" stroke="none" x="540" y="46" width="2" height="1" stroke-width="1" transform="translate(0.5, 0.5)"></rect><text x="540" y="42.5">ChatService</text><text x="540" y="58.5">(llm-chat)</text></g></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="220" y="110" width="260" height="60" fill="#ffe6cc" stroke="#d79b00" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" direction="" text-anchor="middle" font-size="13px"><rect fill="none" stroke="none" x="350" y="141" width="2" height="1" stroke-width="1" transform="translate(0.5, 0.5)"></rect><text x="350" y="137.5">MemoryHook</text><text x="350" y="153.5">passive recall</text></g></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="600" y="110" width="260" height="60" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" direction="" text-anchor="middle" font-size="13px"><rect fill="none" stroke="none" x="730" y="141" width="2" height="1" stroke-width="1" transform="translate(0.5, 0.5)"></rect><text x="730" y="137.5">MemoryToolPackage</text><text x="730" y="153.5">7 tools</text></g></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="80" y="220" width="1000" height="360" fill="#f8fafc" stroke="#6c8ebf" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" font-weight="bold" direction="" text-anchor="middle" font-size="14px"><rect fill="none" stroke="none" x="580" y="231" width="2" height="1" stroke-width="1" transform="translate(0.5, 0.5)"></rect><text x="580" y="243">MemoryService</text></g></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="340" y="280" width="220" height="80" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" direction="" text-anchor="middle" font-size="12px"><rect fill="none" stroke="none" x="450" y="321" width="2" height="1" stroke-width="1" transform="translate(0.5, 0.5)"></rect><text x="450" y="318">MemoryPool</text><text x="450" y="332">CRUD + semantic candidates</text></g></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="100" y="280" width="200" height="80" rx="12" ry="12" fill="#f5f5f5" stroke="#666666" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" direction="" text-anchor="middle" font-size="12px"><rect fill="none" stroke="none" x="200" y="321" width="2" height="1" stroke-width="1" transform="translate(0.5, 0.5)"></rect><text x="200" y="318">TextEmbeddingProvider</text><text x="200" y="332">encode()</text></g></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="600" y="280" width="220" height="80" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" direction="" text-anchor="middle" font-size="12px"><rect fill="none" stroke="none" x="710" y="321" width="2" height="1" stroke-width="1" transform="translate(0.5, 0.5)"></rect><text x="710" y="318">SelectionStrategy</text><text x="710" y="332">MMR / weighted random</text></g></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="600" y="400" width="220" height="60" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" direction="" text-anchor="middle" font-size="12px"><rect fill="none" stroke="none" x="710" y="431" width="2" height="1" stroke-width="1" transform="translate(0.5, 0.5)"></rect><text x="710" y="428">ScoreComposer</text><text x="710" y="442">sim + PageRank + recency</text></g></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="860" y="280" width="200" height="80" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" direction="" text-anchor="middle" font-size="12px"><rect fill="none" stroke="none" x="960" y="321" width="2" height="1" stroke-width="1" transform="translate(0.5, 0.5)"></rect><text x="960" y="318">LinkPool</text><text x="960" y="332">directed links</text></g></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="860" y="400" width="200" height="60" fill="#ffe6cc" stroke="#d79b00" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" direction="" text-anchor="middle" font-size="12px"><rect fill="none" stroke="none" x="960" y="431" width="2" height="1" stroke-width="1" transform="translate(0.5, 0.5)"></rect><text x="960" y="428">SemanticLinker</text><text x="960" y="442">semantic links</text></g></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="340" y="620" width="220" height="60" rx="9" ry="9" fill="#f5f5f5" stroke="#666666" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" direction="" t